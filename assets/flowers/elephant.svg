  <rect x="130" y="120" width="16" height="40" rx="6" fill="#8a8d93"/>
  <rect x="160" y="118" width="16" height="42" rx="6" fill="#8a8d93"/>

  <!-- Tail -->
  <path d="M175 95 Q195 110 190 135" stroke="#75787e" stroke-width="5" fill="none" stroke-linecap="round"/>
