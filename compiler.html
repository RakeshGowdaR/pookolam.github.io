<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="./libs/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <img id="target" src="./assets/pookolam-source-v2.png" crossorigin="anonymous" />
  <script>
    window.runCompile = async function () {
      const img = document.getElementById('target');
      if (!img.complete) {
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });
      }
      const compiler = new window.MINDAR.IMAGE.Compiler();
      await compiler.compileImageTargets([img], (progress) => {
        console.log('compile progress', progress);
      });
      const exported = compiler.exportData();
      // exportData() returns a Uint8Array (msgpack-encoded) — convert to base64 for transfer.
      let binary = '';
      const bytes = new Uint8Array(exported);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return { base64: btoa(binary), byteLength: bytes.length, type: Object.prototype.toString.call(exported) };
    };
  </script>
</body>
</html>
