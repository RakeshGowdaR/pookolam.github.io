<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Pookolam AR</title>
  <script src="./libs/aframe-v1.6.0.min.js"></script>
  <script src="./libs/mindar-image-aframe.prod.js"></script>
  <style>
    /*
      Only html gets an opaque background. The camera <video> element (added
      by mindar-image-aframe) is a child of body with z-index:-2 — since body
      doesn't establish its own stacking context, that negative z-index only
      resolves correctly against html's root context. If body also painted
      an opaque background, it would render as a normal layer ABOVE the
      negative-z-index video (per CSS stacking rules) and hide it completely.
    */
    html { margin: 0; height: 100%; background: #000; }
    body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    /*
      mindar-image-aframe sizes/positions the camera <video> itself via a
      manual transform (its own "cover" math), which has shown up wrong
      (tiny, corner-pinned) on at least one iOS version. Forcing it here
      with plain CSS object-fit is the modern, more broadly-reliable way to
      guarantee full-screen coverage regardless of that internal logic.
      position:fixed also sidesteps any ambiguity about body's height on
      iOS Safari, where the dynamic toolbar can make 100% heights unreliable.
    */
    body > video {
      position: fixed !important; inset: 0 !important;
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important; z-index: -2 !important;
    }
    #caption {
      position: fixed; left: 0; right: 0; bottom: 28px;
      text-align: center; z-index: 10; pointer-events: none;
      font-family: Georgia, 'Times New Roman', serif;
      color: #fff8e6; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      font-size: 5vw; max-width: 90%; margin: 0 auto;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #caption.show { opacity: 1; }
    #replay-btn {
      position: fixed; right: 16px; bottom: 20px; z-index: 10;
      background: rgba(20,20,20,0.65); color: #ffd24c; border: 1px solid #ffd24c;
      border-radius: 999px; padding: 10px 18px; font-size: 4vw; font-family: sans-serif;
    }
    #music-btn {
      position: fixed; left: 16px; bottom: 20px; z-index: 10;
      background: rgba(20,20,20,0.65); color: #ffd24c; border: 1px solid #ffd24c;
      border-radius: 999px; padding: 10px 18px; font-size: 4vw; font-family: sans-serif;
    }
    #music-btn.disabled { opacity: 0.35; pointer-events: none; }
    #hint {
      position: fixed; top: 18px; left: 0; right: 0; text-align: center; z-index: 10;
      color: #fff; font-family: sans-serif; font-size: 3.6vw; opacity: 0.85;
      pointer-events: none;
    }
    #error {
      position: fixed; inset: 0; z-index: 20; display: none;
      background: rgba(20,0,0,0.92); color: #fff; font-family: sans-serif;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    #error.show { display: flex; }
    #error p { max-width: 480px; line-height: 1.5; font-size: 4.2vw; }
    #error button {
      margin-top: 20px; background: #ffd24c; color: #200; border: none;
      border-radius: 999px; padding: 12px 24px; font-size: 4vw; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="hint">Point the camera at the pookolam</div>
  <div id="caption"></div>
  <button id="replay-btn">Replay ⟲</button>
  <button id="music-btn">🔊 Music</button>
  <audio id="bg-music" src="./assets/music.mp3" loop preload="none"></audio>
  <div id="error">
    <p id="error-text"></p>
    <button id="error-retry">Reload</button>
  </div>

  <!--
    imageTargetSrc is currently compiled from the shortlisted DESIGN MOCKUP
    (assets/pookolam-source-v2.png — woman/boat/palm/lotus design), not a
    photo of the finished physical pookolam — tracking quality against the
    real floor design may differ.

    TO SWITCH TO A REAL PHOTO ONCE THE PHYSICAL DESIGN EXISTS:
    1. Photograph the finished physical design (see ar/webar_build_guide.md).
    2. Recompile: replace assets/pookolam-source-v2.png with the new photo
       (update the filename in compiler.html too) and rerun
       `node compile-marker.js` (or use
       https://hiukim.github.io/mind-ar-js-doc/tools/compile manually).
    3. Update TARGET_ASPECT in app.js to the new photo's height/width ratio,
       and retune the STORY_BEATS/RING_ACCENTS x/y fractions to match.
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/pookolam.mind; autoStart: true; uiScanning: false; uiLoading: false; uiError: false;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="marigold" src="./assets/flowers/marigold.svg" />
      <img id="jasmine" src="./assets/flowers/jasmine.svg" />
      <img id="butterfly-pea" src="./assets/flowers/butterfly-pea.svg" />
      <img id="lotus" src="./assets/flowers/lotus.svg" />
      <img id="sparkle" src="./assets/flowers/sparkle.svg" />
      <img id="burst" src="./assets/flowers/burst.svg" />
      <img id="bee" src="./assets/flowers/bee.svg" />
      <img id="trunk" src="./assets/flowers/trunk.svg" />
      <img id="frond" src="./assets/flowers/frond.svg" />
      <img id="boat" src="./assets/flowers/boat.svg" />
      <img id="happy-onam" src="./assets/flowers/happy-onam.svg" />
      <img id="king-mahabali" src="./assets/flowers/king-mahabali.svg" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="pookolam-target" mindar-image-target="targetIndex: 0">
      <!-- Story-beat flower layers and sparkles are added here at runtime by app.js -->
    </a-entity>
  </a-scene>

  <!-- Cache-busting version bump — increment this whenever app.js changes,
       so GitHub Pages' 10-minute cache doesn't serve stale JS to returning
       visitors (this is what caused "still see old design" after a deploy). -->
  <script src="./app.js?v=2"></script>
</body>
</html>
